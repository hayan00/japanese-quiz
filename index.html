<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>일본어 단어 퀴즈</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #f5f5f0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1rem;
    }
    .container { width: 100%; max-width: 480px; }
    h1 {
      font-size: 18px;
      font-weight: 500;
      color: #333;
      text-align: center;
      margin-bottom: 1.5rem;
      letter-spacing: -0.3px;
    }
    .score-bar {
      display: flex;
      gap: 10px;
      margin-bottom: 1.25rem;
    }
    .score-chip {
      flex: 1;
      background: #fff;
      border: 1px solid #e5e5e5;
      border-radius: 10px;
      padding: 10px;
      text-align: center;
    }
    .score-chip .num { font-size: 22px; font-weight: 500; color: #222; display: block; }
    .score-chip .lbl { font-size: 12px; color: #999; margin-top: 2px; display: block; }
    .progress-text {
      font-size: 13px;
      color: #aaa;
      text-align: right;
      margin-bottom: 6px;
    }
    .word-card {
      background: #fff;
      border: 1px solid #e5e5e5;
      border-radius: 16px;
      padding: 2.5rem 1.5rem;
      text-align: center;
      margin-bottom: 1.25rem;
    }
    .kanji { font-size: 52px; font-weight: 500; color: #111; line-height: 1.2; }
    .pos { font-size: 13px; color: #bbb; margin-top: 8px; }
    .input-group { margin-bottom: 12px; }
    .input-label { font-size: 13px; color: #888; margin-bottom: 6px; display: block; }
    .input-row { display: flex; gap: 8px; align-items: center; }
    .input-row input {
      flex: 1;
      font-size: 16px;
      padding: 10px 14px;
      border-radius: 10px;
      border: 1px solid #e0e0e0;
      background: #fff;
      color: #222;
      outline: none;
      transition: border-color 0.15s;
    }
    .input-row input:focus { border-color: #999; }
    .input-row input:disabled { background: #fafafa; color: #888; }
    .badge {
      font-size: 13px;
      font-weight: 500;
      padding: 5px 10px;
      border-radius: 8px;
      white-space: nowrap;
      visibility: hidden;
    }
    .badge.correct { visibility: visible; background: #e8f5e9; color: #2e7d32; }
    .badge.wrong   { visibility: visible; background: #fdecea; color: #c62828; }
    .btn {
      width: 100%;
      padding: 12px;
      font-size: 15px;
      font-weight: 500;
      border-radius: 10px;
      border: 1px solid #ddd;
      cursor: pointer;
      transition: background 0.15s;
      margin-bottom: 8px;
    }
    .btn-check { background: #fff; color: #222; }
    .btn-check:hover { background: #f5f5f5; }
    .btn-next { background: #f0f0f0; color: #222; display: none; }
    .btn-next:hover { background: #e8e8e8; }
    .answer-reveal {
      background: #f9f9f9;
      border-radius: 10px;
      padding: 12px 16px;
      margin-top: 10px;
      font-size: 14px;
      color: #777;
      display: none;
      line-height: 1.8;
    }
    .answer-reveal span { color: #222; font-weight: 500; }
    .finish-msg { text-align: center; padding: 2rem 0; }
    .finish-msg .big { font-size: 42px; margin-bottom: 12px; }
    .finish-msg .result { font-size: 20px; font-weight: 500; color: #222; margin-bottom: 6px; }
    .finish-msg .sub { font-size: 14px; color: #999; }
  </style>
</head>
<body>
<div class="container">
  <h1>일본어 단어 퀴즈</h1>

  <div class="score-bar">
    <div class="score-chip"><span class="num" id="sc-correct">0</span><span class="lbl">정답</span></div>
    <div class="score-chip"><span class="num" id="sc-wrong">0</span><span class="lbl">오답</span></div>
    <div class="score-chip"><span class="num" id="sc-remain">10</span><span class="lbl">남은 문제</span></div>
  </div>
  <div style="font-size:12px;color:#bbb;text-align:right;margin-bottom:8px;">JLPT N3 · な형용사 50단어</div>

  <div id="quiz-area">
    <div class="progress-text" id="progress-text">1 / 10</div>

    <div class="word-card">
      <div class="kanji" id="kanji-display"></div>
      <div class="pos" id="pos-display"></div>
    </div>

    <div class="input-group">
      <label class="input-label" for="reading-input">읽는 방법 (히라가나)</label>
      <div class="input-row">
        <input type="text" id="reading-input" placeholder="예: たべる" autocomplete="off" />
        <span class="badge" id="reading-badge"></span>
      </div>
    </div>

    <div class="input-group">
      <label class="input-label" for="meaning-input">뜻 (한국어)</label>
      <div class="input-row">
        <input type="text" id="meaning-input" placeholder="예: 먹다" autocomplete="off" />
        <span class="badge" id="meaning-badge"></span>
      </div>
    </div>

    <button class="btn btn-check" id="btn-check" onclick="checkAnswer()">정답 확인</button>
    <button class="btn btn-next" id="btn-next" onclick="nextWord()">다음 단어 →</button>

    <div class="answer-reveal" id="answer-reveal"></div>
  </div>

  <div class="finish-msg" id="finish-area" style="display:none"></div>
</div>

<script>
const words = [
  {"kanji":"安全","reading":"あんぜん","meanings":["안전하다"],"pos":"な형용사"},
  {"kanji":"意外","reading":"いがい","meanings":["의외이다"],"pos":"な형용사"},
  {"kanji":"一生懸命","reading":"いっしょうけんめい","meanings":["열심히","필사적이다"],"pos":"な형용사"},
  {"kanji":"偉大","reading":"いだい","meanings":["위대하다"],"pos":"な형용사"},
  {"kanji":"遠慮","reading":"えんりょ","meanings":["사양함","조심함"],"pos":"な형용사"},
  {"kanji":"勝手","reading":"かって","meanings":["제멋대로임"],"pos":"な형용사"},
  {"kanji":"簡単","reading":"かんたん","meanings":["간단하다"],"pos":"な형용사"},
  {"kanji":"結構","reading":"けっこう","meanings":["훌륭하다","충분하다"],"pos":"な형용사"},
  {"kanji":"国際的","reading":"こくさいてき","meanings":["국제적이다"],"pos":"な형용사"},
  {"kanji":"複雑","reading":"ふくざつ","meanings":["복잡하다"],"pos":"な형용사"},
  {"kanji":"積極的","reading":"せっきょくてき","meanings":["적극적이다"],"pos":"な형용사"},
  {"kanji":"消極的","reading":"しょうきょくてき","meanings":["소극적이다"],"pos":"な형용사"},
  {"kanji":"自由","reading":"じゆう","meanings":["자유롭다"],"pos":"な형용사"},
  {"kanji":"大切","reading":"たいせつ","meanings":["중요하다","소중하다"],"pos":"な형용사"},
  {"kanji":"得意","reading":"とくい","meanings":["능숙하다","자신있다"],"pos":"な형용사"},
  {"kanji":"苦手","reading":"にがて","meanings":["서투르다","약하다"],"pos":"な형용사"},
  {"kanji":"熱心","reading":"ねっしん","meanings":["열심이다"],"pos":"な형용사"},
  {"kanji":"必要","reading":"ひつよう","meanings":["필요하다"],"pos":"な형용사"},
  {"kanji":"正直","reading":"しょうじき","meanings":["정직하다","솔직하다"],"pos":"な형용사"},
  {"kanji":"夢中","reading":"むちゅう","meanings":["열중함","몰두함"],"pos":"な형용사"},
  {"kanji":"無駄","reading":"むだ","meanings":["소용없음","낭비이다"],"pos":"な형용사"},
  {"kanji":"無理","reading":"むり","meanings":["무리이다","불가능하다"],"pos":"な형용사"},
  {"kanji":"楽","reading":"らく","meanings":["편안하다","쉽다"],"pos":"な형용사"},
  {"kanji":"真剣","reading":"しんけん","meanings":["진지하다"],"pos":"な형용사"},
  {"kanji":"新鮮","reading":"しんせん","meanings":["신선하다"],"pos":"な형용사"},
  {"kanji":"親切","reading":"しんせつ","meanings":["친절하다"],"pos":"な형용사"},
  {"kanji":"丁寧","reading":"ていねい","meanings":["정중하다","공손하다"],"pos":"な형용사"},
  {"kanji":"特別","reading":"とくべつ","meanings":["특별하다"],"pos":"な형용사"},
  {"kanji":"突然","reading":"とつぜん","meanings":["갑작스럽다"],"pos":"な형용사"},
  {"kanji":"普段","reading":"ふだん","meanings":["평소이다","보통이다"],"pos":"な형용사"},
  {"kanji":"本気","reading":"ほんき","meanings":["진심이다"],"pos":"な형용사"},
  {"kanji":"真面目","reading":"まじめ","meanings":["성실하다","진실하다"],"pos":"な형용사"},
  {"kanji":"明確","reading":"めいかく","meanings":["명확하다"],"pos":"な형용사"},
  {"kanji":"立派","reading":"りっぱ","meanings":["훌륭하다","뛰어나다"],"pos":"な형용사"},
  {"kanji":"当然","reading":"とうぜん","meanings":["당연하다"],"pos":"な형용사"},
  {"kanji":"普通","reading":"ふつう","meanings":["보통이다","일반적이다"],"pos":"な형용사"},
  {"kanji":"完璧","reading":"かんぺき","meanings":["완벽하다"],"pos":"な형용사"},
  {"kanji":"便利","reading":"べんり","meanings":["편리하다"],"pos":"な형용사"},
  {"kanji":"不便","reading":"ふべん","meanings":["불편하다"],"pos":"な형용사"},
  {"kanji":"様々","reading":"さまざま","meanings":["다양하다","여러 가지이다"],"pos":"な형용사"},
  {"kanji":"純粋","reading":"じゅんすい","meanings":["순수하다"],"pos":"な형용사"},
  {"kanji":"深刻","reading":"しんこく","meanings":["심각하다"],"pos":"な형용사"},
  {"kanji":"平均","reading":"へいきん","meanings":["평균적이다"],"pos":"な형용사"},
  {"kanji":"独特","reading":"どくとく","meanings":["독특하다"],"pos":"な형용사"},
  {"kanji":"正確","reading":"せいかく","meanings":["정확하다"],"pos":"な형용사"},
  {"kanji":"不明","reading":"ふめい","meanings":["불분명하다","알 수 없다"],"pos":"な형용사"},
  {"kanji":"絶対","reading":"ぜったい","meanings":["절대적이다"],"pos":"な형용사"},
  {"kanji":"様々","reading":"さまざま","meanings":["다양하다"],"pos":"な형용사"},
  {"kanji":"純粋","reading":"じゅんすい","meanings":["순수하다"],"pos":"な형용사"},
  {"kanji":"真剣","reading":"しんけん","meanings":["진지하다","진심이다"],"pos":"な형용사"},
];

let order = [], idx = 0, correct = 0, wrong = 0;

function shuffle(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function norm(s) { return s.trim().replace(/\s+/g, ''); }

function init() {
  order = shuffle(words.map((_, i) => i));
  idx = 0; correct = 0; wrong = 0;
  document.getElementById('finish-area').style.display = 'none';
  document.getElementById('quiz-area').style.display = 'block';
  document.getElementById('reading-input').style.display = '';
  document.getElementById('meaning-input').style.display = '';
  document.querySelectorAll('.input-group').forEach(el => el.style.display = '');
  updateScore();
  showWord();
}

function showWord() {
  const w = words[order[idx]];
  document.getElementById('kanji-display').textContent = w.kanji;
  document.getElementById('pos-display').textContent = w.pos;
  document.getElementById('progress-text').textContent = (idx + 1) + ' / ' + words.length;
  document.getElementById('reading-input').value = '';
  document.getElementById('meaning-input').value = '';
  document.getElementById('reading-input').disabled = false;
  document.getElementById('meaning-input').disabled = false;
  setBadge('reading-badge', null);
  setBadge('meaning-badge', null);
  document.getElementById('answer-reveal').style.display = 'none';
  document.getElementById('btn-check').style.display = 'block';
  document.getElementById('btn-next').style.display = 'none';
  document.getElementById('reading-input').focus();
}

function setBadge(id, state) {
  const el = document.getElementById(id);
  el.className = 'badge';
  if (state === 'correct') { el.classList.add('correct'); el.textContent = '✓ 정답'; }
  else if (state === 'wrong') { el.classList.add('wrong'); el.textContent = '✗ 오답'; }
}

function updateScore() {
  document.getElementById('sc-correct').textContent = correct;
  document.getElementById('sc-wrong').textContent = wrong;
  document.getElementById('sc-remain').textContent = words.length - idx;
}

function checkAnswer() {
  const w = words[order[idx]];
  const rOk = norm(document.getElementById('reading-input').value) === norm(w.reading);
  const mOk = w.meanings.some(m => norm(m) === norm(document.getElementById('meaning-input').value));
  setBadge('reading-badge', rOk ? 'correct' : 'wrong');
  setBadge('meaning-badge', mOk ? 'correct' : 'wrong');
  if (rOk && mOk) correct++; else wrong++;
  updateScore();
  const reveal = document.getElementById('answer-reveal');
  reveal.innerHTML = '정답: <span>' + w.reading + '</span> — <span>' + w.meanings[0] + '</span>';
  reveal.style.display = 'block';
  document.getElementById('btn-check').style.display = 'none';
  document.getElementById('btn-next').style.display = 'block';
  document.getElementById('reading-input').disabled = true;
  document.getElementById('meaning-input').disabled = true;
}

function nextWord() {
  idx++;
  if (idx >= words.length) {
    document.getElementById('quiz-area').style.display = 'none';
    const pct = Math.round(correct / words.length * 100);
    document.getElementById('finish-area').innerHTML =
      '<div class="big">' + (pct >= 80 ? '🎉' : pct >= 50 ? '👍' : '📚') + '</div>' +
      '<div class="result">' + correct + ' / ' + words.length + ' 정답</div>' +
      '<div class="sub" style="margin-bottom:1.5rem">정답률 ' + pct + '%</div>' +
      '<button class="btn btn-check" onclick="init()">다시 시작</button>';
    document.getElementById('finish-area').style.display = 'block';
    document.getElementById('sc-remain').textContent = 0;
    return;
  }
  showWord();
}

document.getElementById('reading-input').addEventListener('keydown', e => { if (e.key === 'Enter') document.getElementById('meaning-input').focus(); });
document.getElementById('meaning-input').addEventListener('keydown', e => { if (e.key === 'Enter') checkAnswer(); });

init();
</script>
</body>
</html>
