<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>일본어 단어 퀴즈</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #f5f5f0; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 1rem; }
    .container { width: 100%; max-width: 500px; }
    h1 { font-size: 18px; font-weight: 500; color: #333; text-align: center; margin-bottom: 1.5rem; }
    .score-bar { display: flex; gap: 10px; margin-bottom: 1.25rem; }
    .score-chip { flex: 1; background: #fff; border: 1px solid #e5e5e5; border-radius: 10px; padding: 10px; text-align: center; }
    .score-chip .num { font-size: 22px; font-weight: 500; color: #222; display: block; }
    .score-chip .lbl { font-size: 12px; color: #999; margin-top: 2px; display: block; }
    .progress-text { font-size: 13px; color: #aaa; text-align: right; margin-bottom: 6px; }
    .word-card { background: #fff; border: 1px solid #e5e5e5; border-radius: 16px; padding: 2.5rem 1.5rem; text-align: center; margin-bottom: 1.25rem; }
    .kanji { font-size: 52px; font-weight: 500; color: #111; line-height: 1.2; }
    .input-group { margin-bottom: 12px; }
    .input-label { font-size: 13px; color: #888; margin-bottom: 6px; display: block; }
    .input-row { display: flex; gap: 8px; align-items: center; }
    .input-row input { flex: 1; font-size: 16px; padding: 10px 14px; border-radius: 10px; border: 1px solid #e0e0e0; background: #fff; color: #222; outline: none; transition: border-color 0.15s; }
    .input-row input:focus { border-color: #999; }
    .input-row input:disabled { background: #fafafa; color: #888; }
    .badge { font-size: 13px; font-weight: 500; padding: 5px 10px; border-radius: 8px; white-space: nowrap; visibility: hidden; }
    .badge.correct { visibility: visible; background: #e8f5e9; color: #2e7d32; }
    .badge.wrong { visibility: visible; background: #fdecea; color: #c62828; }
    .btn { width: 100%; padding: 12px; font-size: 15px; font-weight: 500; border-radius: 10px; border: 1px solid #ddd; cursor: pointer; transition: background 0.15s; margin-bottom: 8px; }
    .btn-check { background: #fff; color: #222; }
    .btn-check:hover { background: #f5f5f5; }
    .btn-next { background: #f0f0f0; color: #222; display: none; }
    .btn-next:hover { background: #e8e8e8; }

    .reveal { display: none; margin-top: 12px; border-radius: 12px; overflow: hidden; border: 1px solid #e5e5e5; }
    .reveal-answer { background: #f9f9f9; padding: 12px 16px; font-size: 14px; color: #555; border-bottom: 1px solid #e5e5e5; }
    .reveal-answer strong { color: #222; }
    .reveal-components { background: #fff; padding: 12px 16px; }
    .reveal-components-title { font-size: 12px; color: #aaa; margin-bottom: 10px; letter-spacing: 0.3px; }
    .component-row { display: grid; grid-template-columns: auto 1fr 1.5fr; gap: 10px; padding: 8px 0; border-bottom: 1px solid #f0f0f0; align-items: start; }
    .component-row:last-child { border-bottom: none; }
    .comp-kanji { font-size: 15px; font-weight: 500; color: #222; min-width: 80px; }
    .comp-reading { display: flex; flex-wrap: wrap; gap: 4px; }
    .reading-tag { font-size: 12px; padding: 2px 7px; border-radius: 6px; }
    .reading-tag.on  { background: #e8f0fe; color: #1a56db; }
    .reading-tag.kun { background: #fef3c7; color: #92400e; }
    .comp-radical { font-size: 13px; color: #888; line-height: 1.5; }

    .loading { text-align: center; padding: 3rem 0; color: #999; font-size: 15px; }
    .error-msg { text-align: center; padding: 2rem; background: #fdecea; border-radius: 12px; color: #c62828; font-size: 14px; line-height: 1.7; }
    .meta-info { font-size: 12px; color: #bbb; text-align: right; margin-bottom: 8px; }
    .finish-msg { text-align: center; padding: 2rem 0; }
    .finish-msg .big { font-size: 42px; margin-bottom: 12px; }
    .finish-msg .result { font-size: 20px; font-weight: 500; color: #222; margin-bottom: 6px; }
    .finish-msg .sub { font-size: 14px; color: #999; margin-bottom: 1.5rem; }
    .mode-select { display: flex; gap: 10px; margin-bottom: 1.5rem; }
    .mode-btn { flex: 1; padding: 14px; font-size: 15px; font-weight: 500; border-radius: 12px; border: 1.5px solid #e0e0e0; background: #fff; color: #888; cursor: pointer; transition: all 0.15s; }
    .mode-btn:hover { border-color: #aaa; color: #444; }
    .mode-btn.active { border-color: #333; color: #222; background: #fff; }
    .mode-label { font-size: 12px; display: block; margin-top: 4px; font-weight: 400; }
  </style>
</head>
<body>
<div class="container">
  <h1>일본어 단어 퀴즈</h1>
  <div id="app"><div class="loading">단어 불러오는 중...</div></div>
</div>

<script>
const CSV_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vSMpct6-lmuwmRJZ-rMAAb11YZb27FMnbETvw2Mg_YaDj4zxgXD7Ksf45w5QNJ29OSsTP1nMehwCE4K/pub?output=csv';

let words = [], order = [], idx = 0, correct = 0, wrong = 0, mode = 'reading';

function norm(s) { return s.trim().replace(/\s+/g, ''); }

function parseCSVLine(line) {
  const cols = [];
  let cur = '', inQ = false;
  for (let i = 0; i < line.length; i++) {
    const c = line[i];
    if (c === '"') { inQ = !inQ; }
    else if (c === ',' && !inQ) { cols.push(cur.trim()); cur = ''; }
    else { cur += c; }
  }
  cols.push(cur.trim());
  return cols;
}

function parseCSV(text) {
  const lines = text.trim().split('\n').map(l => l.replace(/\r$/, ''));
  const headers = parseCSVLine(lines[0]);
  const idx = {
    kanji:    headers.findIndex(h => h === '단어'),
    reading:  headers.findIndex(h => h === '히라가나'),
    meaning:  headers.findIndex(h => h === '뜻'),
    compK:    headers.findIndex(h => h.includes('구성 한자')),
    on:       headers.findIndex(h => h.includes('음독')),
    kun:      headers.findIndex(h => h.includes('훈독')),
    radical:  headers.findIndex(h => h.includes('부수')),
  };
  const result = [];
  let current = null;
  for (let i = 1; i < lines.length; i++) {
    const c = parseCSVLine(lines[i]);
    const kanji   = idx.kanji   >= 0 ? c[idx.kanji]   || '' : '';
    const reading = idx.reading >= 0 ? c[idx.reading]  || '' : '';
    const meaning = idx.meaning >= 0 ? c[idx.meaning]  || '' : '';
    const compK   = idx.compK   >= 0 ? c[idx.compK]    || '' : '';
    const on      = idx.on      >= 0 ? c[idx.on]       || '' : '';
    const kun     = idx.kun     >= 0 ? c[idx.kun]      || '' : '';
    const radical = idx.radical >= 0 ? c[idx.radical]  || '' : '';

    if (kanji && reading && meaning) {
      current = { kanji, reading, meanings: meaning.split('/').map(m => m.trim()), components: [] };
      if (compK) current.components.push({ kanji: compK, on, kun, radical });
      result.push(current);
    } else if (!kanji && current && compK) {
      current.components.push({ kanji: compK, on, kun, radical });
    }
  }
  return result;
}

async function loadWords() {
  try {
    const res = await fetch(CSV_URL);
    if (!res.ok) throw new Error('시트를 불러올 수 없어요 (HTTP ' + res.status + ')');
    const text = await res.text();
    words = parseCSV(text);
    if (words.length === 0) throw new Error('단어 데이터가 없어요.');
    renderQuiz();
  } catch (e) {
    document.getElementById('app').innerHTML = `<div class="error-msg">⚠️ ${e.message}<br><br>시트 설정: <strong>파일 → 웹에 게시 → CSV → 게시</strong></div>`;
  }
}

function shuffle(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function setMode(m) {
  mode = m;
  document.querySelectorAll('.mode-btn').forEach(b => b.classList.toggle('active', b.dataset.mode === m));
  const rg = document.getElementById('reading-group');
  const mg = document.getElementById('meaning-group');
  if (rg) rg.style.display = mode === 'reading' ? '' : 'none';
  if (mg) mg.style.display = mode === 'meaning' ? '' : 'none';
  document.getElementById('reading-input').value = '';
  document.getElementById('meaning-input').value = '';
  document.getElementById('reading-badge').className = 'badge';
  document.getElementById('meaning-badge').className = 'badge';
  document.getElementById(mode === 'reading' ? 'reading-input' : 'meaning-input').focus();
}

function renderQuiz() {
  document.getElementById('app').innerHTML = `
    <div class="mode-select">
      <button class="mode-btn${mode === 'reading' ? ' active' : ''}" data-mode="reading" onclick="setMode('reading')">
        읽기 맞추기<span class="mode-label">히라가나로 입력</span>
      </button>
      <button class="mode-btn${mode === 'meaning' ? ' active' : ''}" data-mode="meaning" onclick="setMode('meaning')">
        뜻 맞추기<span class="mode-label">한국어로 입력</span>
      </button>
    </div>
    <div class="score-bar">
      <div class="score-chip"><span class="num" id="sc-correct">0</span><span class="lbl">정답</span></div>
      <div class="score-chip"><span class="num" id="sc-wrong">0</span><span class="lbl">오답</span></div>
      <div class="score-chip"><span class="num" id="sc-remain">${words.length}</span><span class="lbl">남은 문제</span></div>
    </div>
    <div class="meta-info">총 ${words.length}단어</div>
    <div class="progress-text" id="progress-text">1 / ${words.length}</div>
    <div class="word-card">
      <div class="kanji" id="kanji-display"></div>
    </div>
    <div class="input-group" id="reading-group">
      <label class="input-label" for="reading-input">읽는 방법 (히라가나)</label>
      <div class="input-row">
        <input type="text" id="reading-input" placeholder="히라가나로 입력" autocomplete="off" />
        <span class="badge" id="reading-badge"></span>
      </div>
    </div>
    <div class="input-group" id="meaning-group">
      <label class="input-label" for="meaning-input">뜻 (한국어)</label>
      <div class="input-row">
        <input type="text" id="meaning-input" placeholder="한국어 뜻 입력" autocomplete="off" />
        <span class="badge" id="meaning-badge"></span>
      </div>
    </div>
    <button class="btn btn-check" id="btn-check" onclick="checkAnswer()">정답 확인</button>
    <button class="btn btn-next" id="btn-next" onclick="nextWord()">다음 단어 →</button>
    <div class="reveal" id="reveal"></div>
    <div class="finish-msg" id="finish-area" style="display:none"></div>
  `;
  order = shuffle(words.map((_, i) => i));
  idx = 0; correct = 0; wrong = 0;
  showWord();
  document.getElementById('reading-input').addEventListener('keydown', e => { if (e.key === 'Enter') checkAnswer(); });
  document.getElementById('meaning-input').addEventListener('keydown', e => { if (e.key === 'Enter') checkAnswer(); });
}

function showWord() {
  const w = words[order[idx]];
  document.getElementById('kanji-display').textContent = w.kanji;
  document.getElementById('progress-text').textContent = (idx + 1) + ' / ' + words.length;
  document.getElementById('reading-input').value = '';
  document.getElementById('meaning-input').value = '';
  document.getElementById('reading-input').disabled = false;
  document.getElementById('meaning-input').disabled = false;
  document.getElementById('reading-badge').className = 'badge';
  document.getElementById('meaning-badge').className = 'badge';
  document.getElementById('reading-group').style.display = mode === 'reading' ? '' : 'none';
  document.getElementById('meaning-group').style.display = mode === 'meaning' ? '' : 'none';
  document.getElementById('reveal').style.display = 'none';
  document.getElementById('reveal').innerHTML = '';
  document.getElementById('btn-check').style.display = 'block';
  document.getElementById('btn-next').style.display = 'none';
  document.getElementById(mode === 'reading' ? 'reading-input' : 'meaning-input').focus();
}

function setBadge(id, state) {
  const el = document.getElementById(id);
  el.className = 'badge';
  if (state === 'correct') { el.classList.add('correct'); el.textContent = '✓ 정답'; }
  else if (state === 'wrong') { el.classList.add('wrong'); el.textContent = '✗ 오답'; }
}

function checkAnswer() {
  const w = words[order[idx]];
  const rOk = norm(document.getElementById('reading-input').value) === norm(w.reading);
  const mOk = w.meanings.some(m => norm(m) === norm(document.getElementById('meaning-input').value));
  const ok = mode === 'reading' ? rOk : mOk;
  if (mode === 'reading') setBadge('reading-badge', rOk ? 'correct' : 'wrong');
  else setBadge('meaning-badge', mOk ? 'correct' : 'wrong');
  if (ok) correct++; else wrong++;
  document.getElementById('sc-correct').textContent = correct;
  document.getElementById('sc-wrong').textContent = wrong;
  document.getElementById('sc-remain').textContent = words.length - idx - 1;

  let compHTML = '';
  if (w.components && w.components.length > 0) {
    compHTML = `
      <div class="reveal-components">
        <div class="reveal-components-title">구성 한자</div>
        ${w.components.map(c => `
          <div class="component-row">
            <div class="comp-kanji">${c.kanji}</div>
            <div class="comp-reading">
              ${c.on  ? '<span class="reading-tag on">음독 ' + c.on  + '</span>' : ''}
              ${c.kun ? '<span class="reading-tag kun">훈독 ' + c.kun + '</span>' : ''}
            </div>
            <div class="comp-radical">${c.radical}</div>
          </div>`).join('')}
      </div>`;
  }

  const reveal = document.getElementById('reveal');
  reveal.innerHTML = `
    <div class="reveal-answer">정답: <strong>${w.reading}</strong> — <strong>${w.meanings.join(', ')}</strong></div>
    ${compHTML}`;
  reveal.style.display = 'block';
  document.getElementById('btn-check').style.display = 'none';
  document.getElementById('btn-next').style.display = 'block';
  document.getElementById('reading-input').disabled = true;
  document.getElementById('meaning-input').disabled = true;
}

function nextWord() {
  idx++;
  if (idx >= words.length) {
    const pct = Math.round(correct / words.length * 100);
    document.getElementById('finish-area').innerHTML =
      '<div class="big">' + (pct >= 80 ? '🎉' : pct >= 50 ? '👍' : '📚') + '</div>' +
      '<div class="result">' + correct + ' / ' + words.length + ' 정답</div>' +
      '<div class="sub">정답률 ' + pct + '%</div>' +
      '<button class="btn btn-check" onclick="renderQuiz()">다시 시작</button>';
    document.getElementById('finish-area').style.display = 'block';
    document.querySelector('.word-card').style.display = 'none';
    document.querySelectorAll('.input-group').forEach(el => el.style.display = 'none');
    document.getElementById('btn-check').style.display = 'none';
    document.getElementById('btn-next').style.display = 'none';
    document.getElementById('reveal').style.display = 'none';
    return;
  }
  showWord();
}

loadWords();
</script>
</body>
</html>
